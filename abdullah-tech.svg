<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 478" width="1100" height="478" role="img" aria-label="Tech stack">
<defs>
<style><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes popChip{0%{opacity:0;transform:scale(.7)}70%{opacity:1;transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
@keyframes shineX{0%{transform:translateX(-40px)}60%,100%{transform:translateX(140px)}}
@keyframes borderGlow{0%,100%{stroke-opacity:.35}50%{stroke-opacity:.7}}
.row{opacity:0;animation:fadeUp .55s ease forwards}
.chip{opacity:0;animation:popChip .5s cubic-bezier(.2,.8,.3,1.2) forwards;transform-box:fill-box;transform-origin:center}
.shine{animation:shineX 3.8s ease-in-out 2s infinite}
.frame{animation:borderGlow 4s ease-in-out infinite}
]]></style>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"><animate attributeName="stop-color" values="#22d3ee;#34d399;#22d3ee" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#34d399;#22d3ee;#34d399" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="shg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
  <stop offset="50%" stop-color="#fff" stop-opacity=".10"/>
  <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<clipPath id="framec"><rect x="1" y="1" width="1098" height="476" rx="16"/></clipPath>
</defs>
