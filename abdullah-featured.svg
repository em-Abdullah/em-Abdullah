<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320" role="img" aria-label="Featured work">
<defs>
<style type="text/css"><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
]]></style>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"><animate attributeName="stop-color" values="#22d3ee;#34d399;#22d3ee" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#34d399;#22d3ee;#34d399" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
</defs>
<rect x="1" y="1" width="558" height="318" rx="16" fill="#0c1219" stroke="url(#tg)" stroke-width="1.4"/>
<text x="24" y="36" font-size="17" font-weight="bold" fill="url(#tg)">Featured Work</text>
<text x="24" y="58" font-size="12" fill="#64748b">Public builds landing here soon</text>
<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="0.35s" fill="freeze"/>
  <rect x="20" y="78" width="520" height="58" rx="12" fill="#0f1722" stroke="#1e2d3d" stroke-width="1.2"/>
  <rect x="20" y="78" width="520" height="58" rx="12" fill="none" stroke="#22d3ee" stroke-opacity=".4" stroke-width="1" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <text x="40" y="102" font-size="14" fill="#e2e8f0" font-weight="bold">— slots open —</text>
  <text x="40" y="122" font-size="12" fill="#64748b">Next.js · NestJS</text>
  <text x="500" y="112" text-anchor="end" font-size="12" fill="#34d399" font-weight="bold" letter-spacing="1.5">
    <animate attributeName="opacity" values=".45;1;.45" dur="2.2s" repeatCount="indefinite"/>
    SOON
  </text>
</g>
<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="0.55s" fill="freeze"/>
  <rect x="20" y="148" width="520" height="58" rx="12" fill="#0f1722" stroke="#1e2d3d" stroke-width="1.2"/>
  <rect x="20" y="148" width="520" height="58" rx="12" fill="none" stroke="#22d3ee" stroke-opacity=".4" stroke-width="1" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <text x="40" y="172" font-size="14" fill="#e2e8f0" font-weight="bold">— shipping next —</text>
  <text x="40" y="192" font-size="12" fill="#64748b">TypeScript · GraphQL</text>
  <text x="500" y="182" text-anchor="end" font-size="12" fill="#34d399" font-weight="bold" letter-spacing="1.5">
    <animate attributeName="opacity" values=".45;1;.45" dur="2.2s" repeatCount="indefinite"/>
    SOON
  </text>
</g>
<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="0.75s" fill="freeze"/>
  <rect x="20" y="218" width="520" height="58" rx="12" fill="#0f1722" stroke="#1e2d3d" stroke-width="1.2"/>
  <rect x="20" y="218" width="520" height="58" rx="12" fill="none" stroke="#22d3ee" stroke-opacity=".4" stroke-width="1" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <text x="40" y="242" font-size="14" fill="#e2e8f0" font-weight="bold">— building in public —</text>
  <text x="40" y="262" font-size="12" fill="#64748b">React · MongoDB</text>
  <text x="500" y="252" text-anchor="end" font-size="12" fill="#34d399" font-weight="bold" letter-spacing="1.5">
    <animate attributeName="opacity" values=".45;1;.45" dur="2.2s" repeatCount="indefinite"/>
    SOON
  </text>
</g>
<text x="280" y="300" text-anchor="middle" font-size="12.5" fill="#94a3b8" opacity="0">
  <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.1s" fill="freeze"/>
  <tspan fill="#64748b">“</tspan><tspan fill="#67e8f9">I ship products people enjoy using.</tspan><tspan fill="#64748b">”</tspan>
</text>
</svg>