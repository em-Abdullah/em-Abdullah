<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 42" width="780" height="42" role="img" aria-label="Watch the snake eat my contributions">
<defs>
<style type="text/css"><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
]]></style>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#34d399"/>
</linearGradient>
</defs>
<text x="390.0" y="20" text-anchor="middle" font-size="18" font-weight="bold" fill="url(#tg)" opacity="0">
  <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.1s" fill="freeze"/>
  Watch the snake eat my contributions
</text>
<rect x="310.0" y="32" width="0" height="2" rx="1" fill="url(#tg)" opacity=".7">
  <animate attributeName="width" from="0" to="160" dur="0.6s" begin="0.25s" fill="freeze"/>
</rect>
</svg>